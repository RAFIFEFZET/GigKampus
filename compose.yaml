name: gigkampus

x-backend: &backend
  image: gigkampus-app:local
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
    - public-storage:/var/www/html/storage/app/public

x-worker: &worker
  <<: *backend
  user: www-data
  depends_on:
    app:
      condition: service_healthy
  stop_signal: SIGTERM
  stop_grace_period: 65s
  healthcheck:
    test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -q 'php artisan queue:work database'"]
    interval: 10s
    timeout: 3s
    retries: 3

services:
  app:
    <<: *backend
    build:
      context: .
      target: app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000, timeout: 2) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: gigkampus-web:local
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - public-storage:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18.7-trixie@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  queue-ocr:
    <<: *worker
    command: ["php", "artisan", "queue:work", "database", "--queue=ocr", "--tries=2", "--timeout=45"]

  queue-default:
    <<: *worker
    command: ["php", "artisan", "queue:work", "database", "--queue=default", "--tries=3", "--timeout=60"]

  reverb:
    <<: *backend
    user: www-data
    stop_signal: SIGTERM
    command: ["php", "artisan", "reverb:start"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  storage:
  public-storage:
